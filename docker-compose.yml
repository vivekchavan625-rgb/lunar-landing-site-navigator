services:
  db:
    image: postgis/postgis:16-3.4
    environment: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: "${POSTGRES_ADMIN_PASSWORD:-postgres}", POSTGRES_DB: lunar_navigator }
    ports: ["127.0.0.1:5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL","pg_isready -U postgres -d lunar_navigator"], interval: 5s, retries: 10 }
  science-engine:
    build: ./science-engine
    environment:
      SPICE_KERNEL_DIR: /data/kernels
      SPICE_META_KERNEL: /data/kernels/mission.tm
      KERNEL_MANIFEST: /data/metadata/kernel_manifest.json
    volumes: ["./data:/data:ro"]
    ports: ["127.0.0.1:8000:8000"]   # loopback only; never expose the engine publicly
  backend:
    build: ./backend
    environment:
      NODE_ENV: development
      PORT: 5000
      APP_URL: "${APP_URL:-http://localhost:5173}"
      DATABASE_URL: "postgresql://app_user:${APP_DB_PASSWORD:-CHANGE_ME_IN_ENV}@db:5432/lunar_navigator"
      SCIENCE_ENGINE_URL: http://science-engine:8000
    depends_on: { db: { condition: service_healthy }, science-engine: { condition: service_started } }
    ports: ["5000:5000"]
volumes: { pgdata: {} }
